name: nightly
# Builds securl for every supported platform each night and publishes the archives, with SHA1SUMS and SHA256SUMS, as the
# one release tagged `nightly`, so that a machine without a Go toolchain can install it. There are no other releases: the
# release and its tag are replaced by the next build.
#
# Only `master` is ever published. A pull request that touches this workflow, or a manual run of another branch, builds
# and verifies everything and uploads the files as a workflow artifact without publishing.
#
# Downloads: https://github.com/LeafAI/securl/releases/download/nightly/<file>
on:
  schedule:
    - cron: "17 18 * * *"
  pull_request:
    paths:
      - ".github/workflows/nightly.yml"
      - "scripts/release.sh"
      - "scripts/publish-nightly.sh"
      - "scripts/sign-release.sh"
      - "scripts/macos-pkg.sh"
      - "scripts/add-to-sums.sh"
      - "keys/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The version is made here from the date and the commit, never from a branch or tag name, which a person chooses.
      - name: Decide what to build
        id: decide
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version="nightly-$(date -u +%Y%m%d)-${SHA:0:7}"
          publish=false
          if [ "$REF" = "refs/heads/master" ] && { [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; }; then
            publish=true
          fi
          # A night with no new commit on master does not replace the release: its date would change and nothing else.
          # A manual run always does, so that a person can refresh it.
          if [ "$publish" = true ] && [ "$EVENT" = "schedule" ]; then
            current="$(gh api "repos/${REPO}/git/ref/tags/nightly" --jq '.object.sha' 2>/dev/null || true)"
            if [ "$current" = "$SHA" ]; then
              publish=skip
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "building $version, publish=$publish"
      - name: Test
        if: steps.decide.outputs.publish != 'skip'
        run: go test ./...
      - name: Build, package and checksum
        if: steps.decide.outputs.publish != 'skip'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: scripts/release.sh dist "$VERSION"
      - name: Verify the checksums the way a user will
        if: steps.decide.outputs.publish != 'skip'
        working-directory: dist
        run: |
          sha1sum --check --strict SHA1SUMS
          sha256sum --check --strict SHA256SUMS
      # Everything but the sums: they are finished by `macos`, which adds the package to them, and the only copy of SHA1SUMS and
      # SHA256SUMS that `sign` and `publish` ever see is the one in that job's artifact. Two artifacts that both held the sums would
      # leave it to the order of two downloads which one is used, and the wrong one would sign a list that does not name the package.
      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.publish != 'skip'
        with:
          name: securl-nightly
          path: |
            dist/
            !dist/SHA1SUMS
            !dist/SHA256SUMS
          if-no-files-found: error
      # `macos` starts from the sums that `build` made and adds to them.
      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.publish != 'skip'
        with:
          name: securl-nightly-sums
          path: |
            dist/SHA1SUMS
            dist/SHA256SUMS
          if-no-files-found: error

  # The macOS installer package needs Apple's tools (pkgbuild, productbuild, lipo), which exist on a Mac only, so it is made here from
  # the two darwin binaries that `build` made, not by building again. It is added to SHA256SUMS before `sign` runs, which is the
  # point: a package that is not in the signed list would be published next to a signature that says nothing about it. This job has
  # no secret and no token to write with, and runs for the same builds as `sign` (a master schedule or manual run).
  macos:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: securl-nightly
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: securl-nightly-sums
          path: dist
      - name: Unpack the two darwin builds
        working-directory: dist
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p ../darwin
          tar -xzf "securl_${VERSION}_darwin_arm64.tar.gz" -C ../darwin
          tar -xzf "securl_${VERSION}_darwin_amd64.tar.gz" -C ../darwin
      - name: Make the package
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          scripts/macos-pkg.sh "$VERSION" \
            "darwin/securl_${VERSION}_darwin_arm64/securl" "darwin/securl_${VERSION}_darwin_amd64/securl" \
            "dist/securl_${VERSION}_macos.pkg"
          cp "dist/securl_${VERSION}_macos.pkg" dist/securl_macos.pkg
      - name: List the package in the checksums
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: scripts/add-to-sums.sh dist "securl_${VERSION}_macos.pkg" securl_macos.pkg
      - name: Verify the checksums the way a user will
        working-directory: dist
        run: |
          shasum -a 1 --check --strict SHA1SUMS
          shasum -a 256 --check --strict SHA256SUMS
      - name: Look inside the package
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          pkgutil --payload-files "dist/securl_${VERSION}_macos.pkg" | grep -x './securl'
          pkgutil --expand-full "dist/securl_${VERSION}_macos.pkg" /tmp/pkg-x
          lipo -archs /tmp/pkg-x/securl-component.pkg/Payload/securl
      - uses: actions/upload-artifact@v4
        with:
          name: securl-nightly-macos
          path: |
            dist/securl_*_macos.pkg
            dist/securl_macos.pkg
            dist/SHA1SUMS
            dist/SHA256SUMS
          if-no-files-found: error

  # The only job that sees the signing key, and the only one that has it: it can write nothing to the repository or to the
  # release, so a signature cannot be made and published by the same job. The environment lets only `master` read the key.
  sign:
    if: needs.build.outputs.publish == 'true'
    needs: [build, macos]
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      # The script and the public key are taken from the commit that was built.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: securl-nightly
          path: dist
      # What `macos` made: the package, and the sums that list it. The signature is of these sums, and they are the only sums here.
      - uses: actions/download-artifact@v4
        with:
          name: securl-nightly-macos
          path: dist
      - name: Sign SHA256SUMS and check the signature against the published key
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: scripts/sign-release.sh dist keys/securl-release.pub
      - uses: actions/upload-artifact@v4
        with:
          name: securl-nightly-signature
          path: dist/SHA256SUMS.sig
          if-no-files-found: error

  publish:
    if: needs.build.outputs.publish == 'true'
    needs: [build, macos, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The scripts are taken from the commit that was built, so what publishes is what was tested.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: securl-nightly
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: securl-nightly-macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: securl-nightly-signature
          path: dist
      - name: Check again before publishing
        working-directory: dist
        run: |
          sha1sum --check --strict SHA1SUMS
          sha256sum --check --strict SHA256SUMS
      # The signature is checked here too, with the public key of the commit being published and no private key in sight: the
      # check a user makes, made by the job that hands the files over.
      - name: Check the signature the way a user will
        run: |
          ssh-keygen -Y verify -f keys/allowed_signers -I securl-release -n securl-release -s dist/SHA256SUMS.sig < dist/SHA256SUMS
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
        run: scripts/publish-nightly.sh dist "$COMMIT" "$VERSION" "$REPO"
